services:
  db:
    image: mongo:7
    container_name: bot-arena-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./src/backend
    container_name: bot-arena-backend
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://db:27017
      MONGO_DB: bot_arena
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./src/frontend
    container_name: bot-arena-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  mongo_data:
